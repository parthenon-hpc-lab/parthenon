# This file was made in part with generative AI
name: Check Formatting

# Using pull_request (rather than push) so that the check also runs for and
# reports on PRs opened from forks.
on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  check-formatting:
    # Name kept to match the existing required status check.
    name: Check Python and C++ Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.12'
    - name: Install pre-commit
      run: python -m pip install pre-commit==4.6.2
    - name: Run clang-format, black, and cpplint
      run: pre-commit run --all-files --show-diff-on-failure --color=always
